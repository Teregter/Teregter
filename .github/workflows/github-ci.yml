name: C CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make dpkg

      - name: Build Application
        run: make build

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make dpkg
        
      - name: Run Tests
        run: make test

  # deb:
  #   needs: test
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout Repository
  #       uses: actions/checkout@v4

  #     - name: Install Dependencies
  #       run: sudo apt-get update && sudo apt-get install -y g++ make dpkg
        
      - name: Package .deb
        run: make deb

      - name: Upload .deb Package
        uses: actions/upload-artifact@v4
        with:
          name: Lab-deb-package
          path: build/Labs.deb

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download .deb Package
        uses: actions/download-artifact@v4
        with:
          name: Lab-deb-package
          path: .

